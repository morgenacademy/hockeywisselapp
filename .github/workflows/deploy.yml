name: Deploy

on:
  push:
    # De standaardbranch van deze repo is de werkbranch; `main` bestaat (nog)
    # niet. Beide staan hier, zodat publiceren nu werkt en blijft werken als er
    # later alsnog een `main` komt.
    branches: [main, claude/hockey-wissel-app-04unax]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Geen BASE_PATH hier: vite leidt het basispad af uit public/CNAME, zodat
      # een eigen domein en de github.io-URL allebei kloppen zonder dat je op
      # twee plekken hetzelfde moet onthouden.
      - run: npm run build

      # Een eigen domein zonder CNAME in dist/ raakt GitHub Pages bij de
      # volgende deploy weer kwijt. Liever hier falen dan zaterdag op het veld.
      - name: Controleer het eigen domein
        run: |
          if [ -s public/CNAME ]; then
            if [ ! -s dist/CNAME ]; then
              echo "::error::public/CNAME staat er wel, dist/CNAME niet."
              exit 1
            fi
            echo "Eigen domein: $(cat dist/CNAME)"
          else
            echo "Geen eigen domein; de app komt op /<repo>/ te staan."
          fi

      # De oefenwedstrijd hoort niet in de app die op zaterdag gebruikt wordt.
      # Een versnelde klok die per ongeluk aan staat is erger dan geen
      # oefenmodus, dus dit faalt liever de deploy dan dat het meelift.
      - name: Controleer dat de oefenmodus niet is meegebouwd
        run: |
          if grep -rqE 'Oefenwedstrijd|oefenbalk' dist/; then
            echo "::error::De oefenmodus zit in de productiebuild. Bouw zonder VITE_OEFENMODUS."
            exit 1
          fi
          echo "Geen oefenmodus in de productiebuild."
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
