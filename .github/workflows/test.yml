name: Test

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - name: Controleer dat de oefenmodus niet in de productiebuild zit
        run: |
          npm run build
          if grep -rqE 'Oefenwedstrijd|oefenbalk' dist/; then
            echo "::error::De oefenmodus zit in de productiebuild."
            exit 1
          fi
