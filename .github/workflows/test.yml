name: Test

# Netlify bouwt en publiceert; deze workflow zegt iets anders, namelijk of de
# roosterlogica nog klopt. Daarom draait hij op élke branch, main incluis --
# eerder werd main overgeslagen omdat de deploy-workflow de tests daar al deed,
# en die is er niet meer.
on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      # Een versnelde klok die op zaterdag per ongeluk aan staat is erger dan
      # geen oefenmodus, dus dit faalt liever de build.
      - name: Controleer dat de oefenmodus niet in de productiebuild zit
        run: |
          npm run build
          if grep -rqE 'Oefenwedstrijd|oefenbalk' dist/; then
            echo "::error::De oefenmodus zit in de productiebuild."
            exit 1
          fi
